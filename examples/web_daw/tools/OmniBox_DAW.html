<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBox DAW v2.0</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: #0f172a;
        }
        .sidebar-header h2 { margin: 0; font-size: 20px; color: var(--primary); }
        .category {
            padding: 12px 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
            background: rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
        }
        .song-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.1s;
        }
        .song-item:hover {
            background: var(--surface-hover);
        }
        .song-title { font-weight: 600; font-size: 14px; }
        .song-author { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        
        /* Main Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .top-bar h1 { margin: 0; font-size: 28px; }
        
        .connect-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .connect-btn.connected { background: var(--success); }
        .connect-btn.disconnected { background: var(--danger); }
        
        /* Layout Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            flex: 1;
        }
        
        /* Editor */
        .editor-container {
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            background: #0f172a;
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mode-select {
            background: var(--surface);
            color: white;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }
        textarea {
            flex: 1;
            background: #0b0f19;
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            padding: 16px;
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--border);
            resize: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            outline: none;
        }
        
        /* Controls */
        .controls-panel {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
        }
        .val-badge {
            background: #0f172a;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--border);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .play-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .play-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }
        .play-btn:active { transform: translateY(0); }
        .play-btn:disabled { background: #334155; box-shadow: none; color: #94a3b8; cursor: not-allowed; }
        
        .stop-btn {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .stop-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6); }
        .stop-btn:active { transform: translateY(0); }
        .stop-btn:disabled { background: #334155; box-shadow: none; color: #94a3b8; cursor: not-allowed; }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Library</h2>
        </div>
        <!-- Injected via JS -->
    </div>

    <div class="main">
        <div class="top-bar">
            <div>
                <h1>OmniBox 🎛️ DAW v2.0</h1>
                <p style="color: var(--text-muted); margin: 4px 0 0 0; font-size: 14px;">Professional Web Serial Interface</p>
            </div>
            <button id="connectBtn" class="connect-btn">🔌 Connect USB</button>
        </div>

        <div class="grid-container">
            <!-- Left: Editor -->
            <div class="editor-container">
                <div class="toolbar">
                    <span style="font-weight: 600; font-size: 14px;">Bytebeat Code</span>
                    <select id="modeSelect" class="mode-select">
                        <option value="0">Classic Bytebeat (& 255)</option>
                        <option value="1">Floatbeat (-1.0 to 1.0)</option>
                        <option value="2">Signed Bytebeat (-128 to 127)</option>
                    </select>
                </div>
                <textarea id="codeEditor" spellcheck="false" placeholder="Select a song from the library or write your own..."></textarea>
                <div class="action-buttons">
                    <button id="playBtn" class="play-btn" style="flex: 2;" disabled>▶ PLAY CODE</button>
                    <button id="stopBtn" class="stop-btn" style="flex: 1;" disabled>⏹ STOP</button>
                </div>            </div>

            <!-- Right: Controls -->
            <div class="controls-panel">
                <div class="control-group">
                    <label>Master Volume <span id="volVal" class="val-badge">100%</span></label>
                    <input type="range" id="volSlider" min="0" max="100" value="100" disabled>
                </div>

                <div class="control-group">
                    <label>Playback Speed <span id="speedVal" class="val-badge">1.0x</span></label>
                    <input type="range" id="speedSlider" min="0.01" max="10.0" step="0.01" value="1.0" disabled>
                </div>

                <div class="control-group">
                    <label>Sample Rate Divisor <span id="divVal" class="val-badge">Auto</span></label>
                    <input type="range" id="divSlider" min="0" max="64" value="0" disabled>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">0 = Auto DRS. Increase for Lo-Fi.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="dollchan_library/library_data.js"></script>
    <script>


        let port;
        let writer;

        const connectBtn = document.getElementById('connectBtn');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const volSlider = document.getElementById('volSlider');
        const speedSlider = document.getElementById('speedSlider');
        const divSlider = document.getElementById('divSlider');
        const modeSelect = document.getElementById('modeSelect');
        const codeEditor = document.getElementById('codeEditor');

        // Render Library
        const sidebar = document.getElementById('sidebar');
        let currentCategory = "";
        LIBRARY.forEach(song => {
            if (song.category !== currentCategory) {
                const cat = document.createElement('div');
                cat.className = 'category';
                cat.innerText = song.category;
                sidebar.appendChild(cat);
                currentCategory = song.category;
            }
            const item = document.createElement('div');
            item.className = 'song-item';
            item.innerHTML = `<div class="song-title">${song.name}</div><div class="song-author">by ${song.author}</div>`;
            item.onclick = async () => {
                codeEditor.value = song.code;
                modeSelect.value = song.mode;
                speedSlider.value = song.speed;
                document.getElementById('speedVal').innerText = parseFloat(song.speed).toFixed(2) + 'x';
                if (writer) {
                    await sendCmd("S", song.speed);
                    playBtn.click(); // Auto-play if connected
                }
            };
            sidebar.appendChild(item);
        });

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                
                connectBtn.innerText = "🔌 Connected (COM)";
                connectBtn.className = "connect-btn connected";
                
                // Enable UI
                playBtn.disabled = false;
                stopBtn.disabled = false;
                volSlider.disabled = false;
                speedSlider.disabled = false;
                divSlider.disabled = false;

                // Set initial values
                sendCmd("V", volSlider.value);
                sendCmd("S", speedSlider.value);
                sendCmd("D", divSlider.value);

            } catch (err) {
                console.error('Error connecting:', err);
                alert("Failed to connect: " + err);
            }
        }

        async function sendCmd(cmd, val) {
            if (!writer) return;
            const msg = `${cmd}:${val}\n`;
            const encoder = new TextEncoder();
            // Send in chunks of 64 bytes to prevent ESP32 RX buffer overflow
            for (let i = 0; i < msg.length; i += 64) {
                const chunk = msg.substring(i, i + 64);
                await writer.write(encoder.encode(chunk));
                // small delay for the ESP32 to process the chunk
                await new Promise(r => setTimeout(r, 5));
            }
        }

        connectBtn.addEventListener('click', connectSerial);

        volSlider.addEventListener('input', (e) => {
            document.getElementById('volVal').innerText = e.target.value + '%';
            sendCmd("V", e.target.value);
        });

        speedSlider.addEventListener('input', (e) => {
            document.getElementById('speedVal').innerText = parseFloat(e.target.value).toFixed(1) + 'x';
            sendCmd("S", e.target.value);
        });

        divSlider.addEventListener('input', (e) => {
            let val = e.target.value;
            document.getElementById('divVal').innerText = val == 0 ? 'Auto' : val;
            sendCmd("D", val);
        });
        
        modeSelect.addEventListener('change', (e) => {
            sendCmd("M", e.target.value);
        });

        playBtn.addEventListener('click', async () => {
            let code = codeEditor.value;
            if(!code) return;
            
            // Auto-detect Mode and Sample Rate from comments
            let detectedMode = modeSelect.value;
            let detectedSpeed = speedSlider.value;
            
            const modeMatch = code.match(/\/\/\s*Mode:\s*(signed bytebeat|bytebeat|floatbeat|funcbeat)/i);
            if (modeMatch) {
                let m = modeMatch[1].toLowerCase();
                if (m === 'signed bytebeat') detectedMode = 2;
                else if (m === 'bytebeat') detectedMode = 0;
                else if (m === 'floatbeat' || m === 'funcbeat') detectedMode = 1;
                modeSelect.value = detectedMode;
            }
            
            const srMatch = code.match(/\/\/\s*Sample Rate:\s*(\d+)/i);
            if (srMatch) {
                let sr = parseInt(srMatch[1]);
                detectedSpeed = (sr / 48000.0).toFixed(4); // Internal DAC runs at 48000Hz
                speedSlider.value = detectedSpeed;
                document.getElementById('speedVal').innerText = detectedSpeed + 'x';
            }
            
            // Send mode and speed first
            await sendCmd("M", detectedMode);
            await sendCmd("S", detectedSpeed);
            
            // Strip multi-line comments
            code = code.replace(/\/\*[\s\S]*?\*\//g, '');
            // Strip single-line comments
            code = code.replace(/\/\/.*/g, '');
            // Optimize code like eval(unescape(escape`XXXX`.replace(/u(..)/g,"$1%")))
            code = code.trim().replace(
                /^eval\(unescape\(escape(?:`|\('|\("|\(`)(.*?)(?:`|'\)|"\)|`\)).replace\(\/u\(\.\.\)\/g,["'`]\$1%["'`]\)\)\)$/,
                (match, m1) => unescape(escape(m1).replace(/u(..)/g, '$1%'))
            );
            // Strip newlines
            code = code.replace(/\n|\r/g, ' ');
            
            await sendCmd("C", code);
            
            playBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            playBtn.innerText = '✓ SENT';
            setTimeout(() => {
                playBtn.style.background = '';
                playBtn.innerText = '▶ PLAY CODE';
            }, 1000);
        });

        stopBtn.addEventListener('click', async () => {
            if (!writer) return;
            // Sending '0' results in silence output for both Floatbeat and Bytebeat.
            await sendCmd("C", "0");
            
            stopBtn.style.background = '#7f1d1d';
            stopBtn.innerText = '✓ STOPPED';
            setTimeout(() => {
                stopBtn.style.background = '';
                stopBtn.innerText = '⏹ STOP';
            }, 1000);
        });
    </script>
</body>
</html>
